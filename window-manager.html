<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>窗口管理器 - MomentTabManager</title>
    <link rel="stylesheet" href="css/window-manager.css">
</head>
<body>
    <div class="window-manager-container">
        <!-- 头部 -->
        <header class="window-manager-header">
            <div class="header-content">
                <img src="icons/icon48.png" alt="MomentTabManager" class="header-icon">
                <div class="header-text">
                    <h1>窗口管理器</h1>
                    <p>多窗口网页内容展示</p>
                </div>
            </div>
        </header>

        <!-- 主要内容区域 -->
        <main class="window-manager-main">
            <!-- 左侧：窗口展示区域 -->
            <div class="windows-container" id="windowsContainer">
                <!-- 动态生成的窗口将在这里显示 -->
                <div class="empty-state">
                    <div class="empty-icon">🪟</div>
                    <h3>欢迎使用窗口管理器</h3>
                    <p>从右侧控制面板配置布局并添加标签页到窗口中</p>
                </div>
            </div>

            <!-- 右侧：控制面板 -->
            <aside class="control-panel">
                <!-- 布局配置 -->
                <section class="control-section">
                    <h3 class="section-title">布局配置</h3>
                    
                    <div class="control-item">
                        <label for="layoutRows">行数</label>
                        <select id="layoutRows" class="control-select">
                            <option value="1">单行</option>
                            <option value="2">双行</option>
                        </select>
                    </div>

                    <div class="control-item">
                        <label for="firstRowCount">第一行窗口数</label>
                        <select id="firstRowCount" class="control-select">
                            <option value="1">1个窗口</option>
                            <option value="2" selected>2个窗口</option>
                            <option value="3">3个窗口</option>
                        </select>
                    </div>

                    <div class="control-item" id="secondRowContainer" style="display: none;">
                        <label for="secondRowCount">第二行窗口数</label>
                        <select id="secondRowCount" class="control-select">
                            <option value="1" selected>1个窗口</option>
                            <option value="2">2个窗口</option>
                            <option value="3">3个窗口</option>
                        </select>
                    </div>

                    <button class="btn-primary" id="applyLayoutBtn">应用布局</button>
                </section>

                <!-- 标签页管理 -->
                <section class="control-section">
                    <h3 class="section-title">标签页管理</h3>
                    
                    <div class="tabs-list-container">
                        <div id="tabsList" class="tabs-list">
                            <div class="loading-message">加载中...</div>
                        </div>
                    </div>
                    
                    <div class="control-actions">
                        <button class="btn-secondary" id="refreshTabsBtn">
                            <span class="btn-icon">🔄</span>
                            刷新列表
                        </button>
                        <button class="btn-secondary" id="clearAllBtn">
                            <span class="btn-icon">🗑️</span>
                            清空所有
                        </button>
                    </div>
                </section>

                <!-- 窗口操作 -->
                <section class="control-section">
                    <h3 class="section-title">窗口操作</h3>

                    <div class="window-actions">
                        <button class="btn-action" id="addToWindowBtn" disabled>
                            <span class="btn-icon">➕</span>
                            添加到窗口
                        </button>
                        <button class="btn-action" id="clearWindowBtn" disabled>
                            <span class="btn-icon">❌</span>
                            清空窗口
                        </button>
                    </div>
                </section>

                <!-- 快捷键帮助 -->
                <section class="control-section">
                    <h3 class="section-title">快捷键</h3>

                    <div class="shortcuts-help">
                        <div class="shortcut-item">
                            <kbd>Ctrl+Enter</kbd>
                            <span>添加到窗口</span>
                        </div>
                        <div class="shortcut-item">
                            <kbd>Delete</kbd>
                            <span>清空窗口</span>
                        </div>
                        <div class="shortcut-item">
                            <kbd>1-9</kbd>
                            <span>选择窗口</span>
                        </div>
                        <div class="shortcut-item">
                            <kbd>F5</kbd>
                            <span>刷新列表</span>
                        </div>
                        <div class="shortcut-item">
                            <kbd>Esc</kbd>
                            <span>取消选择</span>
                        </div>
                        <div class="help-tip">
                            💡 双击标签页可直接添加到空窗口
                        </div>
                    </div>
                </section>
            </aside>
        </main>

        <!-- 状态提示 -->
        <div id="statusMessage" class="status-message hidden"></div>
    </div>

    <!-- 脚本 -->
    <script src="js/utils.js"></script>
    <script src="js/window-manager.js"></script>
</body>
</html>
