<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>窗口管理器 - MomentTabManager</title>
    <link rel="stylesheet" href="css/window-manager.css">
</head>
<body>
    <div class="window-manager-container">
        <!-- 主要内容区域 -->
        <main class="window-manager-main">
            <!-- 左侧：画布区域 -->
            <div class="windows-container" id="windowsContainer">
                <!-- 画布容器 -->
                <div class="canvas-container" id="canvasContainer">
                    <!-- 网格辅助层 -->
                    <div class="grid-overlay" id="gridOverlay">
                        <!-- 网格线将通过CSS生成 -->
                    </div>

                    <!-- 窗口层 -->
                    <div class="windows-layer" id="windowsLayer">
                        <!-- 动态生成的窗口将在这里显示 -->
                    </div>

                    <!-- 空状态提示 -->
                    <div class="empty-state" id="emptyState">
                        <div class="empty-icon">🎨</div>
                        <h3>欢迎使用画布式窗口管理器</h3>
                        <p>从右侧标签页列表拖拽标签页到此画布区域创建窗口</p>
                        <div class="canvas-tips">
                            <div class="tip-item">💡 支持拖拽调整窗口大小和位置</div>
                            <div class="tip-item">🎯 所有窗口自动对齐到6×4网格系统</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 侧边栏触发按钮 -->
            <div class="sidebar-trigger" id="sidebarTrigger">
                <span class="trigger-icon">⚙️</span>
                <span class="trigger-text">设置</span>
            </div>

            <!-- 右侧：可收缩侧边栏 -->
            <aside class="control-panel" id="controlPanel">
                <!-- 标签页管理 -->
                <section class="control-section">
                    <h3 class="section-title">标签页管理</h3>
                    
                    <div class="tabs-list-container">
                        <div id="tabsList" class="tabs-list">
                            <div class="loading-message">加载中...</div>
                        </div>
                    </div>
                    
                    <div class="control-actions">
                        <button class="btn-secondary" id="refreshTabsBtn">
                            <span class="btn-icon">🔄</span>
                            刷新列表
                        </button>
                        <button class="btn-secondary" id="clearAllBtn">
                            <span class="btn-icon">🗑️</span>
                            清空所有
                        </button>
                    </div>
                </section>

                <!-- 窗口操作 -->
                <section class="control-section">
                    <h3 class="section-title">窗口操作</h3>

                    <div class="window-actions">
                        <button class="btn-action" id="addToWindowBtn" disabled>
                            <span class="btn-icon">➕</span>
                            添加到窗口
                        </button>
                        <button class="btn-action" id="clearWindowBtn" disabled>
                            <span class="btn-icon">❌</span>
                            清空窗口
                        </button>
                    </div>
                </section>

                <!-- 快捷键帮助 -->
                <section class="control-section">
                    <h3 class="section-title">快捷键</h3>

                    <div class="shortcuts-help">
                        <div class="shortcut-item">
                            <kbd>Ctrl+Enter</kbd>
                            <span>添加到窗口</span>
                        </div>
                        <div class="shortcut-item">
                            <kbd>Delete</kbd>
                            <span>清空窗口</span>
                        </div>
                        <div class="shortcut-item">
                            <kbd>1-9</kbd>
                            <span>选择窗口</span>
                        </div>
                        <div class="shortcut-item">
                            <kbd>F5</kbd>
                            <span>刷新列表</span>
                        </div>
                        <div class="shortcut-item">
                            <kbd>Esc</kbd>
                            <span>取消选择</span>
                        </div>
                        <div class="help-tip">
                            💡 双击标签页可直接添加到空窗口
                        </div>
                    </div>
                </section>
            </aside>
        </main>

        <!-- 状态提示 -->
        <div id="statusMessage" class="status-message hidden"></div>
    </div>

    <!-- 脚本 -->
    <script src="js/utils.js"></script>
    <!-- interact.js 拖拽库 -->
    <script src="js/interact.min.js"></script>
    <script src="js/window-manager.js"></script>
</body>
</html>
